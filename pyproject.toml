[project]
name = "pycopanlpjml"
version = "1.1.5"
description = "copan:LPJmL, an advanced World-Earth modeling framework extending copan:CORE, integrating LPJmL as the Earth system interface for comprehensive social-ecological simulations."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*.md"]
authors = [
    { name = "Jannes Breier", email = "jannes.breier@pik-potsdam.de" },
    { name = "Lorenz Sieben", email = "sieben@gea.mpg.de" },
]
requires-python = ">=3.9"
keywords = ["DGVM", "ABM", "LPJmL", "copan:CORE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.20.3",
    "netCDF4>=1.5.8",
    "xarray>=0.21.1",
    "networkx>=2.6.3",
    "pycopancore>=0.8.5",
    "pycoupler>=1.7.0",
    "pandas<3.0.0"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8"
]
doc = [
    "sphinx>=6",
    "pydata-sphinx-theme>=0.16.0",
    "numpydoc>=1.1",
    "sphinx-design>=0.4",
    "myst-parser>=1.0",
    "sphinxcontrib-mermaid>=0.7",
    "ablog>=0.10",
    "docutils>=0.18", # mdinclude with myst
]

[project.urls]
homepage = "https://github.com/pik-copan/pycopanlpjml"
issues = "https://github.com/pik-copan/pycopanlpjml/issues"
documentation = "https://pycopanlpjml.readthedocs.io/en/latest/"
source = "https://github.com/pik-copan/pycopanlpjml"

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name="pycopanlpjml"
module-root=""

[tool.aliases]
test = "pytest"
docs = "sphinx-build -b html ./docs ./docs/_build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers"

[tool.black]
line-length = 79
target-version = ['py37', 'py38', 'py39', 'py310']
extend-exclude = "pycopanlpjml/_version.py"